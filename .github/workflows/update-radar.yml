name: European Foresight Radar — Scholarly Discovery and Retrospective Verification
on:
  workflow_dispatch:
  schedule:
    # Two runs daily (UTC), with 14-minute discovery, 9-minute verification, and publishing / housekeeping within ~25-minute job.
    # GitHub-hosted cron is best-effort, not an exact real-time or continuous service.
    - cron: '17 1,13 * * *'
permissions:
  contents: write
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preflight EU-first historical selection before expensive scanning
        run: |
          python -m py_compile scripts/radar.py scripts/radar1_admission.py scripts/scholarly.py scripts/priority.py scripts/radar1_scope_audit.py
          python scripts/radar1_scope_audit.py --report /tmp/radar1-preflight.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/radar1-preflight.json',encoding='utf-8'))
          assert p['original_studies'] > 0
          assert sum(p['selection_counts'].values()) == p['original_studies']
          assert p['historical_period']['end'] == '2023-12-31'
          assert p['retained_in_main_file'] > 0
          print('Radar 1 cheap preflight passed:', p['selection_counts'])
          PY
      - name: Confirm fixed-window scanner is deployed
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import radar
          if getattr(radar, 'FIXED_PHASE_PROTOCOL', None) != 5:
              raise SystemExit('Outdated scripts/radar.py. Upload the new radar.py to the repository scripts folder before running.')
          print('Verified fixed-window + scholarly discovery protocol 5', flush=True)
          PY
      - name: Start 25-minute Radar 1 clock
        shell: bash
        run: echo "RADAR_CLOCK_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Scan rotating foresight sources for 14 full minutes
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          started=$(date +%s)
          python -u scripts/radar.py discover --minutes 14
          elapsed=$(( $(date +%s) - started ))
          echo "Actual discovery duration: ${elapsed}s (minimum 835s; nominal 840s)"
          if (( elapsed < 835 )); then
            echo "::error::Discovery returned early after ${elapsed}s. Scanner did not honor the full 14-minute phase."
            exit 1
          fi
      - name: Verify prioritised studies and scholarly metadata for 9 full minutes
        shell: bash
        run: |
          started=$(date +%s)
          python -u scripts/radar.py verify --minutes 9
          elapsed=$(( $(date +%s) - started ))
          echo "Actual verification duration: ${elapsed}s (minimum 535s; nominal 540s)"
          if (( elapsed < 535 )); then
            echo "::error::Verification returned early after ${elapsed}s. Scanner did not honor the full 9-minute phase."
            exit 1
          fi
      - name: Refresh EU-first historical scope, active selection and priorities
        run: |
          python scripts/radar1_scope_audit.py --apply --report radar1-scope-report.json
          python scripts/priority.py
          python -m json.tool radar1-active.json > /dev/null
          python -m json.tool radar1-rejected.json > /dev/null
          python - <<'PY'
          import json
          a=json.load(open('radar1-active.json'))
          original=json.load(open('research-leads.json'))['leads']
          assert a['original_records'] == len(original)
          assert all(x['date'] <= '2023-12-31' for x in a['studies'] if x['selection']=='active')
          print('Radar 1 active historical selection checked:', a['selection_counts'])
          PY
      - name: Validate JSON and age limits
        run: |
          python -m json.tool findings.json > /dev/null
          python -m json.tool actors.json > /dev/null
          python -m json.tool scan-report.json > /dev/null
          python -m json.tool radar-state.json > /dev/null
          python -m json.tool research-leads.json > /dev/null
          python -m json.tool priority-50.json > /dev/null
          python -m json.tool priority-sources.json > /dev/null
          python scripts/check_data.py
      - name: Build all Scanner 1 leads Excel workbook
        run: python scripts/build_master_excel.py
      - name: Persist source rotation and source-verified findings
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add findings.json radar-state.json research-leads.json radar1-rejected.json radar1-active.json radar1-scope-report.json priority-50.json stuff/WORLD_RADAR_MASTER.xlsx
          if ! git diff --cached --quiet; then
            git commit -m 'European Foresight Radar: advance source rotation and verified findings'
            git pull --rebase
            git push
          else
            echo 'No changes to source rotation or verified research.'
          fi
      - name: Retain scan and rejection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-foresight-audit-${{ github.run_id }}
          path: |
            candidates.json
            scan-report.json
            research-leads.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Finish Radar 1 at approximately 25 minutes
        if: always() && !cancelled()
        shell: bash
        run: |
          if [[ -z "${RADAR_CLOCK_START:-}" ]]; then
            echo "Clock was not started; cannot enforce target runtime."
            exit 1
          fi
          elapsed=$(( $(date +%s) - RADAR_CLOCK_START ))
          if (( elapsed < 1500 )); then
            remaining=$(( 1500 - elapsed ))
            echo "Radar 1 elapsed ${elapsed}s; waiting ${remaining}s to complete 25-minute window."
            sleep "$remaining"
          else
            echo "Radar 1 already ran ${elapsed}s (past 25-minute target)."
          fi
