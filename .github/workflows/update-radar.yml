name: European Foresight Radar — Scholarly Discovery and Retrospective Verification
on:
  workflow_dispatch:
  schedule:
    # Repeat through the day (UTC); each run is 15 FULL minutes discovery + 10 FULL minutes verification.
    # GitHub-hosted cron is best-effort, not an exact real-time or continuous service.
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: eu-foresight-radar-db
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Confirm fixed-window scanner is deployed
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import radar
          if getattr(radar, 'FIXED_PHASE_PROTOCOL', None) != 4:
              raise SystemExit('Outdated scripts/radar.py. Upload the new radar.py to the repository scripts folder before running.')
          print('Verified fixed-window + scholarly discovery protocol 4', flush=True)
          PY
      - name: Scan rotating foresight sources for 15 full minutes
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          started=$(date +%s)
          python -u scripts/radar.py discover --minutes 15
          elapsed=$(( $(date +%s) - started ))
          echo "Actual discovery duration: ${elapsed}s (minimum 895s; nominal 900s)"
          if (( elapsed < 895 )); then
            echo "::error::Discovery returned early after ${elapsed}s. Scanner did not honor the full 15-minute phase."
            exit 1
          fi
      - name: Verify 2015+ studies for 10 full minutes
        shell: bash
        run: |
          started=$(date +%s)
          python -u scripts/radar.py verify --minutes 10
          elapsed=$(( $(date +%s) - started ))
          echo "Actual verification duration: ${elapsed}s (minimum 595s; nominal 600s)"
          if (( elapsed < 595 )); then
            echo "::error::Verification returned early after ${elapsed}s. Scanner did not honor the full 10-minute phase."
            exit 1
          fi
      - name: Validate JSON and age limits
        run: |
          python -m json.tool findings.json > /dev/null
          python -m json.tool actors.json > /dev/null
          python -m json.tool scan-report.json > /dev/null
          python -m json.tool radar-state.json > /dev/null
          python -m json.tool research-leads.json > /dev/null
          python scripts/check_data.py
      - name: Build continuously refreshed master Excel workbook
        run: python scripts/build_master_excel.py
      - name: Persist source rotation and source-verified findings
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add findings.json radar-state.json research-leads.json WORLD_RADAR_MASTER.xlsx
          if ! git diff --cached --quiet; then
            git commit -m 'European Foresight Radar: advance source rotation and verified findings'
            git push
          else
            echo 'No changes to source rotation or verified research.'
          fi
      - name: Retain scan and rejection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-foresight-audit-${{ github.run_id }}
          path: |
            candidates.json
            scan-report.json
            research-leads.json
          if-no-files-found: ignore
          retention-days: 30
