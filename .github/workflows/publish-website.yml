name: Publish radar website (controlled)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'observatory-data.json'
      - 'observatory-data.json.gz'
      - 'reviewed-findings.json'
      - 'VV-FUTURES-*.docx'
      - 'VV-FUTURES-*.xlsx'
      - 'retrospective-results.json'
      - 'outlook-summary.json'
      - 'hindsight-stories.json'
      - 'research-leads.json'
      - 'stuff/WORLD_RADAR_MASTER.xlsx'
      - 'stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx'
      - '.github/workflows/publish-website.yml'
  workflow_run:
    workflows:
      - 'European Foresight Radar — Scholarly Discovery and Retrospective Verification'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore website JSON from compressed database
        run: |
          python - <<'PYCODE'
          import gzip, shutil
          from pathlib import Path
          src = Path('observatory-data.json.gz')
          if src.exists():
              with gzip.open(src, 'rb') as inp, Path('observatory-data.json').open('wb') as out:
                  shutil.copyfileobj(inp, out)
          elif not Path('observatory-data.json').exists():
              raise SystemExit('Cannot publish: cumulative database is missing')
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
