name: Publish radar website (controlled)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'retrospective-results.json'
      - 'outlook-summary.json'
      - 'research-leads.json'
      - 'stuff/WORLD_RADAR_MASTER.xlsx'
      - 'stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx'
      - '.github/workflows/publish-website.yml'
  workflow_run:
    workflows:
      - 'European Foresight Radar — Scholarly Discovery and Retrospective Verification'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
