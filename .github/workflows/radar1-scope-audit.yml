name: Radar 1 - selective historical foresight cleanup (NO SCAN)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Preview first, inspect removed examples, then choose apply.'
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview

permissions:
  contents: write
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false

jobs:
  relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Radar 1 requirements
        run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'xlsxwriter>=3,<4'
      - name: Validate code and scope decisions (NO SCAN)
        run: |
          python -m py_compile scripts/radar1_admission.py scripts/scholarly.py scripts/priority.py scripts/radar1_scope_audit.py
          python -m unittest discover -s tests -p 'test_radar1_admission.py' -v
      - name: Compute substantive relevance preview (NO SCAN; no removal)
        run: python scripts/radar1_scope_audit.py --report radar1-scope-report.json
      - name: Show the proposed cleanup in Actions summary
        env:
          MODE: ${{ inputs.run_mode }}
        run: |
          python - <<'PY'
          import json, os
          x=json.load(open('radar1-scope-report.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## Radar 1 — no-scan substantive relevance audit\n\n')
              f.write(f'**Mode:** {os.environ["MODE"]}\n\n')
              f.write(f'**Saved academic originals checked:** {x["original_studies"]}\n\n')
              f.write(f'**Would retain:** {x["retained_in_main_file"]}\n\n')
              f.write(f'**Would remove:** {x["removed_from_main_file"]}\n\n')
              f.write('The preview does not modify the published research collection.\n\n')
              f.write('### Reason for proposed exclusion\n')
              for k,n in sorted(x['removed_by_reason'].items(), key=lambda kv:-kv[1]):
                  f.write(f'- {k}: **{n}**\n')
              f.write('\nDownload the audit report artifact for each proposed removal, DOI and title.\n')
              f.write('\nRadar 2 was not modified or run.\n')
          PY
      - name: Downloadable complete preview
        uses: actions/upload-artifact@v4
        with:
          name: Radar-1-Relevance-Preview
          path: radar1-scope-report.json
          retention-days: 90
      - name: Back up main collection before apply
        if: ${{ inputs.run_mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: Radar-1-BEFORE-DELETION-${{ github.run_id }}
          path: |
            research-leads.json
            radar1-active.json
            priority-50.json
          retention-days: 90
          if-no-files-found: error
      - name: Apply audited removals and rebuild Radar 1 outputs (NO SCAN)
        if: ${{ inputs.run_mode == 'apply' }}
        run: |
          python scripts/radar1_scope_audit.py --apply --report radar1-scope-report.json
          python scripts/priority.py
          python scripts/build_master_excel.py
          python - <<'PY'
          import json
          leads=json.load(open('research-leads.json'))['leads']
          report=json.load(open('radar1-scope-report.json'))
          rejected=json.load(open('radar1-rejected.json'))['rejected']
          manifest=json.load(open('radar1-active.json'))
          assert report['applied']
          assert len(leads)==manifest['original_records']==report['retained_in_main_file']
          assert all('2011-01-01'<=x['date']<='2023-12-31' for x in leads)
          assert not {x['doi'] for x in leads}&set(rejected)
          assert all(x.get('radar1_selection')=='active' for x in leads)
          assert all(x['doi'] not in rejected for x in json.load(open('priority-50.json'))['items'] if x.get('doi'))
          print('Applied scope cleanup to the actual saved database and rebuilt priorities/Excel.')
          PY
      - name: Commit changes only after an explicit apply
        if: ${{ inputs.run_mode == 'apply' }}
        run: |
          git config user.name 'world-radar-bot'
          git config user.email 'world-radar-bot@users.noreply.github.com'
          git add research-leads.json radar1-rejected.json radar1-active.json radar1-scope-report.json priority-50.json stuff/WORLD_RADAR_MASTER.xlsx
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 1: retain only admitted historical European foresight originals'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Nothing changed.'
          fi
