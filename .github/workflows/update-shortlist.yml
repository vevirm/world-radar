name: Radar 2 - short 20 plus 20 Word

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Radar 2 - outcomes and Word report
    types:
      - completed

permissions:
  contents: write

# Independent of Radar 2. A short report must never trigger another 25-minute scan.
concurrency:
  group: radar-short-word-publisher
  cancel-in-progress: false

jobs:
  short_word:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word dependency
        run: pip install 'python-docx>=1.1,<2'
      - name: Make the short report from already-saved Radar 2 research (NO SCAN)
        run: |
          python -m py_compile scripts/shortlist_report.py
          python scripts/shortlist_report.py \
            --atlas living-atlas.json \
            --output stuff/WORLD_RADAR_20_BEST_20_TO_RECHECK.docx
          python - <<'PY'
          from docx import Document
          d=Document('stuff/WORLD_RADAR_20_BEST_20_TO_RECHECK.docx')
          headings=[p.text for p in d.paragraphs if p.style.name=='Heading 2']
          assert 1 <= len(headings) <= 40, f'Invalid shortlist size: {len(headings)}'
          if len(headings)<40:
              print(f'NOTICE: {len(headings)} screened entries; insufficient trustworthy matches to fill 40.')
          assert any('strongest research trails' in p.text.lower() for p in d.paragraphs)
          assert any('weakest / possibly outdated' in p.text.lower() for p in d.paragraphs)
          print('VALID: screened strongest and to-recheck shortlist, with no API requests.')
          PY
      - name: Refresh full Living Futures Word from the same saved atlas (NO SCAN)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          from scripts.living_report import write_report
          atlas = json.loads(Path('living-atlas.json').read_text(encoding='utf-8'))
          if not atlas.get('records'):
              raise SystemExit('Refusing to overwrite full report with an empty atlas.')
          target = Path('stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx')
          write_report(atlas, target)
          doc = Document(target)
          paragraphs = '\n'.join(p.text for p in doc.paragraphs)
          assert 'Eight conversations across time' in paragraphs
          assert 'Reading trail: every linked follow-up' in paragraphs
          assert 'How complete is this edition?' in paragraphs
          print(f'Full Word rebuilt without research: {len(atlas["records"])} preserved atlas records.')
          PY
      - name: Upload both Word downloads to this Actions run
        uses: actions/upload-artifact@v4
        with:
          name: Radar-2-Short-Word
          path: |
            stuff/WORLD_RADAR_20_BEST_20_TO_RECHECK.docx
            stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if-no-files-found: error
          retention-days: 30
      - name: Publish both updated Words at their permanent website paths
        run: |
          git config user.name 'world-radar-bot'
          git config user.email 'world-radar-bot@users.noreply.github.com'
          git add stuff/WORLD_RADAR_20_BEST_20_TO_RECHECK.docx stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 2: refresh screened full and short Words'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Both Word reports are already up to date.'
          fi
