name: Radar 2 - source evidence pilot (NO SCAN)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Review, pilot OpenAlex searches, test Eurostat comparison, or investigate research connections (draft only)'
        type: choice
        required: true
        default: review_only
        options:
          - review_only
          - live_three_drafts
          - automatic_eurostat_comparison
          - autonomous_ten_question_drafts
          - research_connections_three
          - claim_then_two_sources

permissions:
  contents: read

jobs:
  source_evidence_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-continuity tests without accessing the internet
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_radar2_evidence_review.py tests/test_radar2_live_draft.py tests/test_radar2_auto_observations.py tests/test_radar2_ten_study_pilot.py tests/test_radar2_claim_links.py tests/test_radar2_connections.py tests/test_radar2_then_now.py
      - name: Vet three dated evidence comparisons without modifying active Radar 2
        run: python scripts/radar2_evidence_review.py
      - name: Optional OpenAlex follow-up research for three originals (draft only)
        if: ${{ inputs.mode == 'live_three_drafts' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          MAILTO: ${{ secrets.MAILTO }}
        run: python scripts/radar2_live_draft.py
      - name: Automatically compare original foresight with live Eurostat observations (DRAFT ONLY)
        if: ${{ inputs.mode == 'automatic_eurostat_comparison' }}
        run: python scripts/radar2_auto_observations.py
      - name: Select ten accepted originals, investigate later studies (DRAFT ONLY)
        if: ${{ inputs.mode == 'autonomous_ten_question_drafts' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          MAILTO: ${{ secrets.MAILTO }}
        run: python scripts/radar2_ten_study_pilot.py
      - name: Follow citing studies, research lineage and same-question observations (3 draft originals only)
        if: ${{ inputs.mode == 'research_connections_three' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          MAILTO: ${{ secrets.MAILTO }}
        run: python scripts/radar2_connections.py --max-originals 3
      - name: Read two later official sources for each of three accepted Radar 1 claims (DRAFT ONLY)
        if: ${{ inputs.mode == 'claim_then_two_sources' }}
        run: python scripts/radar2_then_now.py --max-originals 3
      - name: Save review report, not publication data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Radar-2-Source-Evidence-Review
          path: |
            RADAR2-EVIDENCE-REVIEW.json
            RADAR2-EVIDENCE-REVIEW.md
            RADAR2-LIVE-RESEARCH-DRAFT.json
            RADAR2-AUTOMATED-OBSERVATIONS.json
            RADAR2-AUTOMATED-OBSERVATIONS.md
            RADAR2-TEN-QUESTION-PILOT.json
            RADAR2-TEN-QUESTION-PILOT.md
            RADAR2-CONNECTIONS-DRAFT.json
            RADAR2-CONNECTIONS-DRAFT.md
            RADAR2-THEN-NOW-AUTO.json
            RADAR2-THEN-NOW-AUTO.md
          retention-days: 30
          if-no-files-found: warn
