name: VV Futures — cumulative Scanner 2 and outputs
on:
  workflow_dispatch:
  schedule:
    # Scanner 1 operates at 01:17 and 13:17 UTC; start this later.
    - cron: '45 2,14 * * *'
permissions:
  contents: write
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'python-docx>=1.1,<2'
      - name: Restore cumulative database (lossless)
        run: |
          python - <<'PYCODE'
          import gzip
          from pathlib import Path
          compressed = Path('observatory-data.json.gz')
          uncompressed = Path('observatory-data.json')
          if compressed.exists():
              with gzip.open(compressed, 'rb') as source, uncompressed.open('wb') as dest:
                  import shutil
                  shutil.copyfileobj(source, dest)
              print('Restored full database from compressed archive')
          elif not uncompressed.exists():
              raise SystemExit('No cumulative database found; refusing to start with an empty one')
          PYCODE
      - name: Discover later literature and refresh Let’s see
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u scripts/eu_observatory.py scan --minutes 20 --min-minutes 15 --claims 400
      - name: Compress cumulative database with validation
        run: |
          python - <<'PYCODE'
          import gzip, json, os, shutil
          from pathlib import Path
          src = Path('observatory-data.json')
          dst = Path('observatory-data.json.gz')
          payload = src.read_bytes()
          obj = json.loads(payload)
          if not isinstance(obj.get('claims'), dict) or not isinstance(obj.get('connections'), dict):
              raise SystemExit('Refusing to save: missing claim or connection collection')
          tmp = dst.with_suffix('.json.gz.tmp')
          with tmp.open('wb') as handle:
              with gzip.GzipFile(filename='', mode='wb', compresslevel=9, mtime=0, fileobj=handle) as archive:
                  archive.write(payload)
          with gzip.open(tmp, 'rb') as check:
              if check.read() != payload:
                  raise SystemExit('Lossless compression validation failed')
          os.replace(tmp, dst)
          print(f'Preserved {len(obj["claims"])} claims and {len(obj["connections"])} connections; compressed to {dst.stat().st_size:,} bytes')
          # Keep JSON for this run's artifact, but stop Git from tracking it.
          PYCODE
      - name: Save cumulative library and outputs
        run: |
          git config user.name 'vv-futures-bot'
          git config user.email 'vv-futures-bot@users.noreply.github.com'
          git rm --cached -f --ignore-unmatch observatory-data.json
          git add observatory-data.json.gz VV-FUTURES-POSSIBLE-CONNECTIONS.docx
          if ! git diff --cached --quiet; then
            git commit -m 'VV Futures: accumulate candidate research and refresh outputs'
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-futures-research-package
          path: |
            observatory-data.json
            VV-FUTURES-POSSIBLE-CONNECTIONS.docx
          retention-days: 30
