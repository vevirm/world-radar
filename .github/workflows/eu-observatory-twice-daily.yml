name: VV Futures — cumulative Scanner 2 and outputs
on:
  workflow_dispatch:
  schedule:
    # Scanner 1 operates at 01:17 and 13:17 UTC; start this later.
    - cron: '45 2,14 * * *'
permissions:
  contents: write
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'python-docx>=1.1,<2'
      - name: Discover later literature and refresh Let’s see
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u scripts/eu_observatory.py scan --minutes 20 --min-minutes 15 --claims 400
      - name: Compact cumulative JSON before saving
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('observatory-data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          size = p.stat().st_size
          print(f'Compacted file: {size / 1024 / 1024:.2f} MiB')
          if size > 99 * 1024 * 1024:
              raise SystemExit('JSON is still too large for GitHub; database splitting is needed.')
          PYCODE
      - name: Save cumulative library and outputs
        run: |
          git config user.name 'vv-futures-bot'
          git config user.email 'vv-futures-bot@users.noreply.github.com'
          git add observatory-data.json VV-FUTURES-POSSIBLE-CONNECTIONS.docx
          if ! git diff --cached --quiet; then
            git commit -m 'VV Futures: accumulate candidate research and refresh outputs'
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-futures-research-package
          path: |
            observatory-data.json
            VV-FUTURES-POSSIBLE-CONNECTIONS.docx
          retention-days: 30
