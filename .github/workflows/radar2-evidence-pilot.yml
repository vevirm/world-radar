name: Radar 2 - safe evidence pilot

on:
  workflow_dispatch:
    inputs:
      live_openalex:
        description: 'Test OpenAlex live on only 3 original questions? (small API credit usage)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  evidence_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test matching safeguards (no API usage)
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_evidence_engine.py
      - name: Inspect 30 original questions against the saved catalogue (no API usage)
        run: python -u scripts/evidence_pilot.py --mode offline --max-cases 30
      - name: Optional small live OpenAlex test (3 questions; maximum 12 API requests)
        if: inputs.live_openalex == true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          MAILTO: ${{ secrets.MAILTO }}
        run: python -u scripts/evidence_pilot.py --mode live --max-cases 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Radar-2-Evidence-Pilot
          path: |
            EVIDENCE-PILOT-*.md
            EVIDENCE-PILOT-*.json
          if-no-files-found: warn
          retention-days: 14
