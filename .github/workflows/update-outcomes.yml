name: Radar 2 - outcomes and Word report

on:
  workflow_dispatch:
  schedule:
    # Twice daily, after Radar 1 (01:17 and 13:17 UTC).
    - cron: '17 4,16 * * *'

permissions:
  contents: write

# Keep Radar 1 and Radar 2 from running at the same time.
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word report dependency
        run: pip install "python-docx>=1.1,<2"

      - name: Start 25-minute Radar 2 clock
        shell: bash
        run: echo "RADAR_CLOCK_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Research outcomes (up to 23 minutes)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_OUTCOME_MODEL: gpt-4.1-mini
        run: |
          # Reserve time for report commit and final 25-minute clock alignment.
          echo "Radar 2 research budget: 23 minutes; total job target: ~25 minutes."
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning::OPENAI_API_KEY absent; AI-based independent research may be skipped."
          fi
          python -u scripts/retrospective_radar.py --minutes 23 --max-claims 100

      - name: Commit report and accumulated assessments
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add retrospective-results.json stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 2: update retrospective Word report'
            git pull --rebase
            git push
          fi
      - name: Finish Radar 2 at approximately 25 minutes
        if: always() && !cancelled()
        shell: bash
        run: |
          if [[ -z "${RADAR_CLOCK_START:-}" ]]; then
            echo "Clock was not started; cannot enforce target runtime."
            exit 1
          fi
          elapsed=$(( $(date +%s) - RADAR_CLOCK_START ))
          if (( elapsed < 1500 )); then
            remaining=$(( 1500 - elapsed ))
            echo "Radar 2 elapsed ${elapsed}s; waiting ${remaining}s to complete 25-minute window."
            sleep "$remaining"
          else
            echo "Radar 2 already ran ${elapsed}s (past 25-minute target)."
          fi
