name: Radar 2 - outcomes and Word report

on:
  workflow_dispatch:
    inputs:
      allow_offline_report:
        description: 'Only compare studies already in the repository (no live OpenAlex)?'
        required: false
        type: boolean
        default: false
      restore_run_id:
        description: 'Optional: recover saved research from a failed publishing run ID (leave blank for a new scan)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write
  actions: read

# Avoid running both radars at once.
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recover research artifact from a previous run (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: Radar-2-Word-and-Audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.restore_run_id }}
          path: .

      - name: Regenerate Radar 2 Word report and research audit
        if: ${{ inputs.restore_run_id == '' }}
        env:
          MAILTO: ${{ secrets.MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALLOW_OFFLINE_REPORT: ${{ inputs.allow_offline_report }}
        run: |
          # Never silently upload an old report from the checkout.
          rm -f stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if [ "${ALLOW_OFFLINE_REPORT}" = "true" ]; then
            python -u scripts/retrospective_radar.py --provider catalogue --minutes 25
          else
            python -u scripts/retrospective_radar.py --provider auto --minutes 25
          fi

      - name: Rebuild living atlas and readable Word report, then validate
        run: |
          # Both a new scan and a recovered artifact produce the same public files.
          python - <<'PYCODE'
          from pathlib import Path
          from scripts.living_atlas import write_atlas, load
          from scripts.living_report import write_report

          entries = load('retrospective-results.json', {}).get('entries', {})
          if not entries:
              raise SystemExit('No accumulated research entries; refusing to publish empty atlas.')
          atlas = write_atlas(list(entries.values()))
          report = Path('stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx')
          write_report(atlas, report)
          print(f'Living atlas: {len(atlas["records"])} entries; Word report: {report}')
          PYCODE
          python -m json.tool living-atlas.json > /dev/null
          python scripts/validate_radar2_report.py

      - name: Show research status in Actions summary
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          audit = json.loads(Path('scanner2-audit.json').read_text(encoding='utf-8'))
          run = audit['run']
          provider = run.get('provider', 'unknown')
          attempts, failures = run.get('attempts', 0), run.get('failed', 0)
          reviewed = audit.get('reviewed_verdicts', 0)
          mode = ('LIVE OpenAlex later-study comparison' if provider == 'openalex' and attempts else
                  'LIVE OpenAI research' if provider == 'openai' and attempts else
                  'SAVED scholarly catalogue only (offline)')
          print(f'Radar 2: {mode}; attempts={attempts}; failures={failures}; source-reviewed outcomes={reviewed}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n## Word report delivery\n\n')
              f.write('- **Generated and validated:** `stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx`\n')
              f.write('- **Download:** expand **Artifacts → Radar-2-Word-and-Audit** at the bottom of this Actions run.\n')
              f.write(f'- **Research mode:** {mode}\n')
              f.write(f'- **Research checks:** {attempts}; **failed:** {failures}\n')
              f.write(f'- **Research time used:** {run.get("research_elapsed_seconds", 0):.0f}s of up to 25 minutes; **stopped because:** {run.get("stop_reason", "unknown")}\n')
              f.write(f'- **New OpenAlex/literature comparisons:** {run.get("literature_comparisons", 0)}\n')
              f.write(f'- **Related studies found in this run:** {run.get("literature_studies_found", 0)}\n')
              f.write(f'- **Leads with newer thematic field literature:** {run.get("field_context_count_total", 0)} (includes previously indexed sources; not all verified outcomes)\n')
              f.write(f'- **Source-reviewed outcome comparisons:** {reviewed}\n')
              f.write('- Later-study abstracts are **provisional scholarly signals**, not verified historical outcomes or accuracy scores.\n')
          if provider in ('catalogue', 'evidence'):
              print('::notice title=Radar 2 catalogue-only::Results come from already indexed papers, not live searches.')
          elif attempts == 0 or attempts == failures:
              print('::warning title=Radar 2 research failed::The Word report was generated but the research provider did not succeed. Check OpenAlex API access and quota.')
          if reviewed == 0:
              print('::warning title=Outcome verification incomplete::No source-reviewed forecast verdicts yet; automatic research cannot substitute for original-source review.')
          PYCODE

      - name: Upload Radar 2 Word file and audit to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Radar-2-Word-and-Audit
          if-no-files-found: error
          retention-days: 30
          path: |
            stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
            scanner2-audit.json
            outcome-review-queue.json
            outlook-summary.json
            hindsight-stories.json
            living-atlas.json
            retrospective-results.json

      - name: Commit generated report and accumulated research
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          # Stage only existing outputs. A missing optional file must not abort
          # the entire run after 25 minutes of successful research.
          for file in retrospective-results.json hindsight-stories.json living-atlas.json outlook-summary.json outcome-observations.json outcome-review-queue.json scanner2-audit.json verified-outcomes.json stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx; do
            if [ -f "$file" ]; then
              git add -- "$file"
            else
              echo "Optional output absent, skipping: $file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 2: update evidence and Word report'
            git pull --rebase
            git push
          fi

      - name: Enforce live research status (no misleading green check)
        env:
          ALLOW_OFFLINE_REPORT: ${{ inputs.allow_offline_report }}
        run: |
          python scripts/check_radar2_live_status.py
