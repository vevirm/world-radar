name: Accumulate post-June evidence and update Word report
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: write
concurrency:
  group: eu-foresight-outcomes
  cancel-in-progress: false
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "python-docx>=1.1,<2"
      - run: python scripts/outcome_tracker.py
      - name: Save cumulative evidence and new Word report
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add outcome-history.json stuff/FUTURE_IDEAS_WHAT_HAPPENED.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Accumulate retrospective evidence and refresh Word report'
            git pull --rebase
            git push
          fi
