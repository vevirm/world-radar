name: Radar 2 - outcomes and Word report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

# Keep Radar 1 and Radar 2 from running at the same time.
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scanner 2 (source-reviewed outcome audit + Word; no false matches)
        env:
          MAILTO: ${{ secrets.MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -u scripts/retrospective_radar.py --provider auto --minutes 18 --max-claims 12
          python -m json.tool retrospective-results.json > /dev/null
          python -m json.tool outlook-summary.json > /dev/null
          test -s stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          python -m json.tool scanner2-audit.json > /dev/null
          python -m json.tool outcome-review-queue.json > /dev/null
          python - <<'PYCODE'
          import json, os
          a = json.load(open("scanner2-audit.json"))
          r = a.get("run", {})
          print(f"Radar 2 provider: {r.get('provider')}; research attempts: {r.get('attempts')}; failed: {r.get('failed')}")
          if r.get("provider") == "evidence":
              print("::warning title=Radar 2 offline audit::OPENAI_API_KEY is missing; Word refreshed using saved data only.")
          if not a["outcome_verification_complete"]:
              print("::warning title=Outcome verification incomplete::No source-verified Expected vs Happened cases. This run generated a research queue and Word evidence audit, NOT a completed outcome analysis.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n## Verification gate\n")
              f.write(f"- Source-verified forecast outcomes: **{a['reviewed_verdicts']}**\n")
              f.write(f"- Forecast passages pending original-text review: **{a['candidate_forecasts']}**\n")
              f.write(f"- Research requests this run: **{r.get('attempts', 0)}**, failures: **{r.get('failed', 0)}**\n")
              f.write("- **Incomplete outcome research** until source-verified comparisons exist.\n" if not a["outcome_verification_complete"] else "- Source-verified comparisons available.\n")
          PYCODE

      - name: Commit report and accumulated assessments
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add retrospective-results.json outlook-summary.json outcome-observations.json outcome-review-queue.json scanner2-audit.json verified-outcomes.json stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 2: update retrospective Word report'
            git pull --rebase
            git push
          fi
