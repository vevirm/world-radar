name: Radar 2 - outcomes and Word report

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'European Foresight Radar — Scholarly Discovery and Retrospective Verification'
    types: [completed]
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

# Keep Radar 1 and Radar 2 from running at the same time.
concurrency:
  group: radar-shared-single-runner
  cancel-in-progress: false

jobs:
  outcomes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word report dependency
        run: pip install "python-docx>=1.1,<2"

      - name: Scanner 1 to Scanner 2 (free OpenAlex follow-up + Word)
        env:
          MAILTO: ${{ secrets.MAILTO }}
        run: |
          python -u scripts/retrospective_radar.py --provider free --minutes 4 --max-claims 100
          python -m json.tool retrospective-results.json > /dev/null
          python -m json.tool outlook-summary.json > /dev/null
          test -s stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx

      - name: Commit report and accumulated assessments
        run: |
          git config user.name 'eu-foresight-radar-bot'
          git config user.email 'eu-foresight-radar-bot@users.noreply.github.com'
          git add retrospective-results.json outlook-summary.json stuff/WHAT_WAS_EXPECTED_WHAT_HAPPENED.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 2: update retrospective Word report'
            git pull --rebase
            git push
          fi
